<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Política de Privacidade – Brasa Certa: Churrasco</title>
    <meta http-equiv="refresh" content="0; url=../privacidade/#brasa-certa" />
    <link rel="canonical" href="../privacidade/#brasa-certa" />
    <style>
      :root {
        --bg: #fafaf8;
        --fg: #1c1b19;
        --muted: #5a5852;
        --line: #e4e2dc;
        --card: #f2f1ec;
        --accent: #a8390c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121211;
          --fg: #ecebe7;
          --muted: #a9a69e;
          --line: #2c2b28;
          --card: #1b1b19;
          --accent: #f0a47a;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.65;
        font-size: 1rem;
      }
      .wrap { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1.25rem 4rem; }
      nav.topo { display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; padding: 0.5rem 0 1.5rem; font-size: 0.95rem; }
      a { color: var(--accent); text-underline-offset: 0.15em; }
      a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
      h1 { font-size: clamp(1.7rem, 5vw, 2.2rem); line-height: 1.2; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
      h2 { font-size: 1.3rem; margin: 2.5rem 0 0.5rem; padding-top: 1.25rem; border-top: 1px solid var(--line); line-height: 1.3; }
      h3 { font-size: 1.05rem; margin: 1.75rem 0 0.25rem; scroll-margin-top: 1rem; }
      p, ul, ol, dl { margin: 0.6rem 0; }
      ul, ol { padding-left: 1.4rem; }
      li { margin: 0.3rem 0; }
      .meta { color: var(--muted); margin: 0 0 1.5rem; }
      .resumo { background: var(--card); border: 1px solid var(--line); border-radius: 0.75rem; padding: 0.25rem 1.1rem; margin: 1.5rem 0; }
      .app { background: var(--card); border: 1px solid var(--line); border-radius: 0.75rem; padding: 0.25rem 1.1rem 0.9rem; margin: 1rem 0; scroll-margin-top: 1rem; }
      .app:target { border-color: var(--accent); }
      .app h3 { margin-top: 0.9rem; }
      .pkg { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.9rem; color: var(--muted); overflow-wrap: anywhere; }
      .contato { font-weight: 600; }
      table { width: 100%; border-collapse: collapse; font-size: 0.95rem; margin: 0.75rem 0; }
      th, td { text-align: left; vertical-align: top; padding: 0.55rem 0.6rem; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-weight: 600; }
      .rolagem { overflow-x: auto; }
      footer { margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <main>
        <h1>Política de Privacidade</h1>
        <p>
          A política de privacidade do <strong>Brasa Certa: Churrasco</strong> agora é única para todos os apps da Quintal Apps.
          Se você não for levado automaticamente, abra a
          <a href="../privacidade/#brasa-certa">Política de Privacidade da Quintal Apps</a>.
        </p>
        <p><a href="../termos/">Termos de Uso</a> · <a href="../">Quintal Apps</a></p>
      </main>
    </div>
  </body>
</html>
